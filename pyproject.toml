[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-game-framework"
version = "0.1.0"
description = "Installable framework for playing turn-based/simultaneous-move games with any mix of human and AI-controlled seats."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian Lee", email = "leejianrong2@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/leejianrong/agent-game-framework"

[project.scripts]
agf = "agent_game_framework.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.14.0",
  "mypy>=1.18.0",
  "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_game_framework"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import `examples.tictactoe` (ADR-0001):
# it lives outside src/agent_game_framework and is never pip-installed.
pythonpath = ["."]
